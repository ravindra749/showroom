spring.application.name=showroom

# Credentials come from the environment and are never stored in source control.
# createDatabaseIfNotExist lets a local MySQL user with CREATE rights start fresh.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/showroom?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that the entities match it.
# Add classpath:db/sample to FLYWAY_LOCATIONS to load the sample vehicles.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
